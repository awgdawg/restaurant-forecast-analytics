name: CI
# Push/PR to the default branch only. Three independent jobs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: no job writes to the repo.
permissions:
  contents: read

jobs:
  # Phase-1 control: ruff lint + format via the tracked .pre-commit-config.yaml.
  # CI-side secret scanning is the dedicated gitleaks step below, NOT the
  # pre-commit gitleaks hook (it only guards staged diffs).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the tip commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install pre-commit
      - run: pre-commit run --all-files
      # pre-commit's gitleaks hook guards staged diffs locally; in CI nothing is
      # staged, so scan the full history explicitly.
      - name: gitleaks (full history scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      # prophet 1.1.6 + cmdstanpy 1.2.4 install from manylinux wheels (prophet
      # ships a precompiled cmdstan) -- the known-slow step. If it turns flaky,
      # mark the one Prophet fit test and run `pytest -q -m "not prophet_fit"`.
      - run: pip install -r requirements.txt
      - run: pytest -q

  bundle-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # README recommends @main for the latest CLI; pin to a release tag if a
      # specific version is ever required.
      - uses: databricks/setup-cli@main
      # No -t -> dev target; validate probes the workspace API, so it needs a
      # host + token. Secrets hold a separate short-lived PAT (not the admin
      # token), added to the repo before this branch is pushed.
      - run: databricks bundle validate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
