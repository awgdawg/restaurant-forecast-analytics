# Databricks Asset Bundle: the nightly pipeline as code (spec 2026-06-29, §5-6).
# dev = authoring/validation target (schedule PAUSED); prod = the paid/trial
# workspace running nightly (schedule LIVE, dbt wired to a SQL warehouse).
bundle:
  name: restaurant-forecast-analytics

variables:
  raw_volume:
    description: UC Volume path where Toast order Parquet lands
    default: /Volumes/workspace/default/raw_orders
  dbt_warehouse_id:
    description: SQL warehouse id for the prod dbt task (pass via --var at deploy)
    default: ""
  gsheet_id:
    description: Google Sheet ID the publish task mirrors the serving tables into
      (not sensitive; pass via --var at deploy)
    default: ""

artifacts:
  default:
    type: whl
    build: python scripts/build_wheel.py
    path: .

resources:
  jobs:
    restaurant_forecast_nightly:
      name: restaurant-forecast-nightly
      # Failure alerting: the 2026-07-17..29 pandas-3 breakage ran silent for
      # 13 days because nothing notified anyone. Never again.
      email_notifications:
        on_failure:
          - aug.l.turner@gmail.com
      schedule:
        # 21:00 America/Chicago (2026-08-07): the pipeline runs post-close (close
        # is 20:00), so each day's finalized tables + next-day forecast land the
        # same night instead of the morning after. Paired with the Cloud Run sync
        # at 20:40 (`rfa-sync --refresh-days 4 --through-today`). The sync sits at
        # :40, not a quarter-hour, because the intraday lane fires on :00/:15/:30/
        # :45 and both write business_date=<today>/orders.parquet -- sharing a
        # minute is a torn-write race. Keep it off those four if it moves again.
        # NOTE: the sync->job gap is 20 min here, down from the 45 min that sized
        # toast-sync's worst case (--max-retries 1 x 900s timeout ~= 30 min).
        # Observed runtime is ~2.5 min end to end, so this covers the normal case
        # but NOT a full hang-and-retry. If the job ever reads a partial Volume,
        # widen this gap first before looking anywhere else.
        # History: 09:15 while the local 08:45 PC extract fed the Volume;
        # 08:30 Cloud Run sync + 09:15 job after the PC path retired;
        # 21:00 sync + 21:45 job from 2026-08-02.
        quartz_cron_expression: "0 0 21 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ./dist/*.whl
              # dbt runs as a managed dbt_task but still needs the adapter
              # installed in the serverless environment (exit 127 without it).
              # Deliberately NOT a wheel dependency -- only the job env needs it.
              - dbt-databricks>=1.10
      tasks:
        # --refresh-days / --window 3: self-healing freshness. Toast allows
        # post-close edits (refunds, tip adjustments) that change values
        # without changing row counts, so the last 3 days are always re-pulled
        # and re-loaded regardless of count reconciliation.
        # Retries (spec §11): extract faces the network -> 2 retries; the rest
        # are idempotent (DELETE+INSERT / overwrite) so 1 retry each is safe.
        #
        # INTERIM (2026-07-06): the extract task is DISABLED. The trial
        # workspace's serverless egress allowlist blocks ws-api.toasttab.com
        # (probe: pypi/googleapis resolve, open internet does not; adding a
        # payment method did not lift it). Until Databricks enables full
        # egress, scripts/morning_extract.ps1 (Windows Task Scheduler, 08:45)
        # extracts locally and uploads the trailing days to the Volume.
        # TO RESTORE FULL-CLOUD: uncomment this task, restore load's
        # depends_on, and set the schedule back to 04:30.
        # - task_key: extract
        #   environment_key: default
        #   max_retries: 2
        #   min_retry_interval_millis: 300000
        #   python_wheel_task:
        #     package_name: restaurant_forecast_analytics
        #     entry_point: rfa-extract
        #     parameters: ["--refresh-days", "3", "--out-dir", "${var.raw_volume}"]
        - task_key: load
          environment_key: default
          max_retries: 1
          python_wheel_task:
            package_name: restaurant_forecast_analytics
            entry_point: rfa-load
            parameters: ["--root", "${var.raw_volume}", "--window", "3"]
        - task_key: dbt_build
          depends_on:
            - task_key: load
          environment_key: default
          max_retries: 1
          dbt_task:
            project_directory: .
            # catalog/schema pin the auto-generated dbt profile to Unity Catalog;
            # without them the managed dbt task defaults to the legacy
            # hive_metastore, which UC-only workspaces disable
            # (UC_HIVE_METASTORE_DISABLED_EXCEPTION -- proven by the T0 spike).
            catalog: workspace
            schema: default
            commands:
              - dbt build
        - task_key: forecast
          depends_on:
            - task_key: dbt_build
          environment_key: default
          max_retries: 1
          python_wheel_task:
            package_name: restaurant_forecast_analytics
            entry_point: rfa-forecast
        # Mirror forecast_vs_actuals + model_metrics into a Google Sheet that
        # Tableau Public syncs from. --sheet-id is passed as a CLI arg because
        # serverless wheel tasks have no env-var injection (same reason
        # GCP_SA_JSON comes from the secret scope). Idempotent overwrite -> 1 retry.
        - task_key: publish
          depends_on:
            - task_key: forecast
          environment_key: default
          max_retries: 1
          python_wheel_task:
            package_name: restaurant_forecast_analytics
            entry_point: rfa-publish
            parameters: ["--sheet-id", "${var.gsheet_id}"]

targets:
  dev:
    default: true
  prod:
    mode: production
    # workspace.host cannot be interpolated (auth field); the CLI reads it from
    # the DATABRICKS_HOST env var at deploy/validate time instead. See the
    # deviation note in the commit / task report for the exact forcing error.
    # Pre-deploy: export DATABRICKS_HOST="https://$DBX_HOST" DATABRICKS_TOKEN="$DBX_TOKEN" (see README runbook).
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    # /Workspace/Shared is world-writable by design (single-operator trial
    # workspace); declare it intentional so validate is clean. Per the CLI's
    # own remediation for the shared-root warning.
    permissions:
      - group_name: users
        level: CAN_MANAGE
    resources:
      jobs:
        restaurant_forecast_nightly:
          schedule:
            pause_status: UNPAUSED
          tasks:
            - task_key: dbt_build
              dbt_task:
                warehouse_id: ${var.dbt_warehouse_id}
