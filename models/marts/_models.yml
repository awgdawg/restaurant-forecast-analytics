version: 2

models:
  - name: stg_orders
    columns:
      - name: order_guid
        data_tests: [not_null, unique]
      - name: business_date
        data_tests: [not_null]
  - name: fct_daily_sales
    columns:
      - name: business_date
        data_tests: [not_null, unique]
      - name: order_count
        data_tests: [not_null]
  - name: forecast_vs_actuals
    columns:
      - name: business_date
        data_tests: [not_null, unique]
  - name: intraday_today
    description: >
      Fast-lane single-row view: today-so-far from the raw Volume partition
      (15-min Cloud Run polling) vs today's forecast. Not read by anything
      downstream; dashboard-only.
    columns:
      - name: business_date
        data_tests: [not_null, unique]
