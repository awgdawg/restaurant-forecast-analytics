[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-forecast-analytics"
version = "0.1.0"
description = "Toast POS -> Databricks + dbt -> Prophet sales forecasting pipeline"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    # Upper caps are load-bearing: the serverless job env re-resolves these
    # nightly from THIS metadata (requirements.txt only pins the local venv).
    # pandas 3 breaks prophet 1.1.6's holiday features (duplicate-label
    # reindex in crosstab; killed the nightly forecast task 2026-07-17..29).
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "databricks-sql-connector>=4.0",
    "databricks-sdk>=0.20,<1",
    "prophet==1.1.6",
    "cmdstanpy==1.2.4",
    "holidays>=0.50",
    "gspread>=6",
    "google-auth>=2",
]

[project.scripts]
rfa-extract = "ingest.extract:main"
rfa-sync = "ingest.sync:main"
rfa-load = "load.run_load:main"
rfa-forecast = "forecast.run_forecast:main"
rfa-publish = "publish.to_sheets:main"

# "publish" MUST be listed: without it the wheel omits the package and the
# in-cloud publish task fails with ModuleNotFoundError.
[tool.setuptools]
packages = ["ingest", "load", "forecast", "publish"]
